<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Slide Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Container Base -->
  <rect width="1280" height="420" rx="24" fill="url(#bgGlow)" stroke="#334155" stroke-width="1.5" />

  <!-- Dynamic / Animated Background Ambient Orbs (Behind content) -->
  <g opacity="0.45" filter="url(#softGlow)">
    <circle cx="200" cy="120" r="140" fill="#6366f1">
      <animate attributeName="cx" values="180;260;180" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;160;100" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="280" r="160" fill="#a855f7">
      <animate attributeName="cx" values="1100;1020;1100" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="290;210;290" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="80" r="110" fill="#ec4899">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite" />
      <animate attributeName="r" values="90;130;90" dur="11s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Modern Grid Texture (Subtle) -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="1200" y1="0" x2="1200" y2="420" />
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
  </g>

  <!-- Left Dynamic Element: Presentation Deck Wireframe with pulsing scan line -->
  <g transform="translate(110, 60)">
    <!-- Slide 1 Shadow/Back -->
    <rect x="24" y="-12" width="180" height="110" rx="8" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="1.5" />
    <!-- Slide 2 Main -->
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2" />
    <!-- Slide UI elements inside -->
    <rect x="16" y="18" width="60" height="42" rx="6" fill="#334155" />
    <rect x="88" y="20" width="96" height="8" rx="4" fill="#6366f1" opacity="0.8" />
    <rect x="88" y="34" width="76" height="6" rx="3" fill="#64748b" />
    <rect x="88" y="46" width="84" height="6" rx="3" fill="#64748b" />
    <rect x="16" y="74" width="168" height="6" rx="3" fill="#475569" />
    <rect x="16" y="86" width="128" height="6" rx="3" fill="#475569" />
    <circle cx="170" cy="98" r="8" fill="#38bdf8" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Dynamic Scanning Bar over slide -->
    <rect x="0" y="0" width="200" height="2" fill="url(#primaryGrad)" filter="url(#glow)">
      <animate attributeName="y" values="0;120;0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Right Dynamic Element: Agentic AI Neural Workflow Node Diagram -->
  <g transform="translate(970, 50)">
    <!-- Node Connectors -->
    <path d="M40 30 L110 70 M40 110 L110 70 M110 70 L170 40 M110 70 L170 100" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 3" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;14" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Node 1: Prompt Input -->
    <circle cx="40" cy="30" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="40" y="34" text-anchor="middle" font-size="11" fill="#c7d2fe">📄</text>
    <!-- Node 2: Document RAG -->
    <circle cx="40" cy="110" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="40" y="114" text-anchor="middle" font-size="11" fill="#c7d2fe">🧠</text>
    <!-- Center Node: AI Agent Planner -->
    <circle cx="110" cy="70" r="24" fill="#312e81" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="r" values="22;25;22" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="110" y="75" text-anchor="middle" font-size="16">🤖</text>
    <!-- Node 3: Output PPTX -->
    <circle cx="170" cy="40" r="15" fill="#1e1b4b" stroke="#f472b6" stroke-width="2" />
    <text x="170" y="44" text-anchor="middle" font-size="11" fill="#fbcfe8">📊</text>
    <!-- Node 4: Export Slides -->
    <circle cx="170" cy="100" r="15" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
    <text x="170" y="104" text-anchor="middle" font-size="11" fill="#bae6fd">✨</text>
  </g>

  <!-- Pulsing Sparkles / Agent Stars -->
  <g transform="translate(370, 75)" opacity="0.85">
    <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#38bdf8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(900, 85)" opacity="0.85">
    <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#ec4899">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle (Unobscured & Crystal Clear) -->
  <!-- Badge Pill Above Title -->
  <g transform="translate(640, 95)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5" />
    <circle cx="-116" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" text-anchor="middle" class="pill-text" fill="#cbd5e1">⚡ Curated AI Agent Showcase 2026</text>
  </g>

  <!-- Main Title -->
  <text x="640" y="185" text-anchor="middle" class="title-text" fill="url(#primaryGrad)">
    Awesome PowerPoint AI Agents
  </text>

  <!-- Subtitle -->
  <text x="640" y="235" text-anchor="middle" class="subtitle-text" fill="#94a3b8">
    Autonomous Slide Generators, SaaS Leaders &amp; Open-Source Agentic Frameworks
  </text>

  <!-- Feature Tags / Quick Navigation Pills at Bottom -->
  <g transform="translate(640, 310)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🤖 Agentic Reasoning</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🏆 SaaS Leaders</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🔓 Open-Source PPT</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">📄 Doc-to-Slides</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">⚡ Local LLM &amp; MCP</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="340" y="380" width="600" height="3" rx="1.5" fill="url(#primaryGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
